name: build-packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest==9.0.2

      - name: Run tests
        run: python -m pytest -q

  packages:
    name: rex deb + Windows zip
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ dpkg-dev zip g++-mingw-w64-x86-64

      - name: Make packaging scripts executable
        run: chmod +x packaging/*.sh

      - name: Build Linux deb
        run: ./packaging/build-deb.sh

      - name: Build Windows zip
        run: ./packaging/build-win-zip.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rex-deb-amd64
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rex-win64
          path: dist/rex-win.zip
          if-no-files-found: error

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/rex_*.deb dist/rex-win.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/rex_*.deb dist/rex-win.zip \
              --generate-notes --title "rex $GITHUB_REF_NAME"
          fi
