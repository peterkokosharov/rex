name: build-packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest==9.0.2

      - name: Install C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends g++

      - name: Run all suites (pytest, headers, native C++)
        run: python tools/run_tests.py

      - name: Upload test-results.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.txt
          if-no-files-found: warn

  packages:
    name: ai-rex deb + Windows zip
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ dpkg-dev zip g++-mingw-w64-x86-64

      - name: Make packaging scripts executable
        run: chmod +x packaging/*.sh

      - name: Build Linux deb
        run: ./packaging/build-deb.sh

      - name: Build Windows zip
        env:
          PYTHON: python3
        run: ./packaging/build-win-zip.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-rex-deb-amd64
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-rex-win64
          path: dist/ai-rex-*-win-x64.zip
          if-no-files-found: error

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ai-rex_*.deb dist/ai-rex-*-win-x64.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ai-rex_*.deb dist/ai-rex-*-win-x64.zip \
              --generate-notes --title "ai-rex $GITHUB_REF_NAME"
          fi
