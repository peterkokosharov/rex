[project]
name = "ai-rex"
version = "0.3.0"
description = "Small stdlib-only agent runtime for OpenAI-compatible endpoints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
ai-rex = "runtime.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# kikolib: pinned, unmodified copy in vendor/kikolib, installed as the top-level package `kikolib`
where = [".", "vendor"]
include = ["ai_runtime_rex", "ai_runtime_rex.*", "runtime", "runtime.*", "runtimelib", "kikolib*"]

[tool.setuptools.package-data]
# Built-in skills ship as data inside the package so they load by default from an installed wheel.
"ai_runtime_rex.core.skills" = ["builtin/*/SKILL.md", "builtin/*/references/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["live: needs network access to real search engines (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false